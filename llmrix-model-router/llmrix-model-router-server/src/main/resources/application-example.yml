llmrix.model.router:
  default-route: general
  routes:
    general:
      strategy: balanced
      candidates: [primary]
  candidates:
    primary:
      provider: openai-compatible
      model-name: ${MODEL_NAME:gpt-4o-mini}
      base-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLMRIX_MODEL_PROVIDER_API_KEY}
      capabilities: [chat]
  server:
    enabled: true
    auth:
      mode: api-key
      bootstrap-key: ${LLMRIX_MODEL_ROUTER_API_KEY}
