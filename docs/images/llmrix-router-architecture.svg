<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">LLMRix Model Router architecture</title>
  <desc id="desc">Clients enter through embedded Java, Spring Boot, or OpenAI-compatible HTTP APIs. The provider-neutral core filters and ranks model targets, executes calls with reliability controls, shares runtime state, and emits telemetry.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .group-title { fill: #374151; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; }
    .node-title { fill: #111827; font-size: 14px; font-weight: 700; }
    .node-sub { fill: #6b7280; font-size: 11px; }
    .badge { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .legend { fill: #4b5563; font-size: 11px; }
    .arrow-label { fill: #374151; font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="36" y="38" class="title">LLMRix Model Router</text>
  <text x="36" y="62" class="subtitle">Provider-neutral routing, reliable execution, shared state, and observable model operations</text>
  <rect x="1013" y="25" width="151" height="35" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1088" y="47" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">JAVA 17+ / MIT</text>

  <!-- Group containers -->
  <rect x="28" y="92" width="154" height="430" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6,4"/>
  <text x="42" y="114" class="group-title">CALLERS</text>
  <rect x="208" y="92" width="174" height="430" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6,4"/>
  <text x="222" y="114" class="group-title">ACCESS</text>
  <rect x="408" y="92" width="434" height="430" rx="8" fill="#eff6ff" fill-opacity="0.45" stroke="#93c5fd" stroke-dasharray="6,4"/>
  <text x="422" y="114" fill="#1d4ed8" font-size="12" font-weight="700" letter-spacing="0.6px">PROVIDER-NEUTRAL CORE</text>
  <rect x="868" y="92" width="304" height="430" rx="8" fill="#fff7ed" fill-opacity="0.55" stroke="#fdba74" stroke-dasharray="6,4"/>
  <text x="882" y="114" fill="#c2410c" font-size="12" font-weight="700" letter-spacing="0.6px">MODEL INTEGRATIONS</text>

  <!-- Caller nodes -->
  <rect x="48" y="136" width="114" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="68" cy="161" r="10" fill="#2563eb"/>
  <text x="68" y="165" text-anchor="middle" class="badge">J</text>
  <text x="105" y="161" text-anchor="middle" class="node-title">Java App</text>
  <text x="105" y="181" text-anchor="middle" class="node-sub">in-process call</text>

  <rect x="48" y="259" width="114" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="68" cy="284" r="10" fill="#16a34a"/>
  <text x="68" y="288" text-anchor="middle" class="badge">S</text>
  <text x="109" y="284" text-anchor="middle" class="node-title">Spring App</text>
  <text x="105" y="304" text-anchor="middle" class="node-sub">auto-configured</text>

  <rect x="48" y="382" width="114" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="68" cy="407" r="10" fill="#6b7280"/>
  <text x="68" y="411" text-anchor="middle" class="badge">API</text>
  <text x="110" y="407" text-anchor="middle" class="node-title">Any SDK</text>
  <text x="105" y="427" text-anchor="middle" class="node-sub">OpenAI client</text>

  <!-- Access nodes -->
  <rect x="232" y="136" width="126" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="295" y="164" text-anchor="middle" class="node-title">Embedded API</text>
  <text x="295" y="184" text-anchor="middle" class="node-sub">LlmRouter Builder</text>

  <rect x="232" y="259" width="126" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="295" y="287" text-anchor="middle" class="node-title">Spring Starter</text>
  <text x="295" y="307" text-anchor="middle" class="node-sub">YAML + Beans</text>

  <rect x="232" y="382" width="126" height="70" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="295" y="410" text-anchor="middle" class="node-title">HTTP / SSE</text>
  <text x="295" y="430" text-anchor="middle" class="node-sub">OpenAI compatible</text>

  <!-- Core nodes -->
  <rect x="438" y="137" width="166" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="521" y="164" text-anchor="middle" class="node-title">Unified Model API</text>
  <text x="521" y="184" text-anchor="middle" class="node-sub">Chat / Embed / Media</text>
  <text x="521" y="199" text-anchor="middle" class="node-sub">ModelClient + errors</text>

  <rect x="646" y="137" width="166" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="729" y="164" text-anchor="middle" class="node-title">Eligibility Filter</text>
  <text x="729" y="184" text-anchor="middle" class="node-sub">capability / modality</text>
  <text x="729" y="199" text-anchor="middle" class="node-sub">cost / health / quota</text>

  <rect x="438" y="257" width="166" height="72" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="521" y="284" text-anchor="middle" class="node-title">Routing Policy</text>
  <text x="521" y="304" text-anchor="middle" class="node-sub">balanced / semantic</text>
  <text x="521" y="319" text-anchor="middle" class="node-sub">bandit / custom SPI</text>

  <rect x="646" y="257" width="166" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="729" y="284" text-anchor="middle" class="node-title">Execution Engine</text>
  <text x="729" y="304" text-anchor="middle" class="node-sub">timeout / retry / switch</text>
  <text x="729" y="319" text-anchor="middle" class="node-sub">stream safety / settle</text>

  <rect x="438" y="377" width="166" height="72" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="521" y="404" text-anchor="middle" class="node-title">Runtime State</text>
  <text x="521" y="424" text-anchor="middle" class="node-sub">RPM / TPM / leases</text>
  <text x="521" y="439" text-anchor="middle" class="node-sub">health / cooldown</text>

  <rect x="646" y="377" width="166" height="72" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="729" y="404" text-anchor="middle" class="node-title">Events &amp; Metrics</text>
  <text x="729" y="424" text-anchor="middle" class="node-sub">request / attempt / token</text>
  <text x="729" y="439" text-anchor="middle" class="node-sub">first-token / cooldown</text>

  <!-- Provider integration node -->
  <rect x="894" y="137" width="252" height="312" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1020" y="166" text-anchor="middle" class="node-title">Provider Adapters</text>
  <text x="1020" y="186" text-anchor="middle" class="node-sub">transport + auth + capability validation</text>

  <circle cx="944" cy="237" r="24" fill="#10a37f"/>
  <text x="944" y="241" text-anchor="middle" class="badge">OAI</text>
  <text x="944" y="274" text-anchor="middle" class="node-sub">OpenAI</text>
  <circle cx="1018" cy="237" r="24" fill="#111827"/>
  <text x="1018" y="241" text-anchor="middle" class="badge">DS</text>
  <text x="1018" y="274" text-anchor="middle" class="node-sub">DeepSeek</text>
  <circle cx="1092" cy="237" r="24" fill="#6366f1"/>
  <text x="1092" y="241" text-anchor="middle" class="badge">OR</text>
  <text x="1092" y="274" text-anchor="middle" class="node-sub">OpenRouter</text>

  <circle cx="982" cy="329" r="24" fill="#f59e0b"/>
  <text x="982" y="333" text-anchor="middle" class="badge">OL</text>
  <text x="982" y="366" text-anchor="middle" class="node-sub">Ollama</text>
  <circle cx="1058" cy="329" r="24" fill="#64748b"/>
  <text x="1058" y="333" text-anchor="middle" class="badge">SPI</text>
  <text x="1058" y="366" text-anchor="middle" class="node-sub">Custom</text>

  <rect x="932" y="394" width="176" height="33" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1020" y="415" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="600">Chat + Embeddings + Media</text>

  <!-- Primary access flows -->
  <path d="M162 171 H232" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M162 294 H232" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M162 417 H232" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M358 173 H438" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M358 294 H397 V188 H438" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M358 417 H397 V203 H438" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Core decision flow -->
  <path d="M604 173 H646" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M729 209 V231 H521 V257" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M604 293 H646" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Provider request and response -->
  <path d="M812 280 H894" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="829" y="264" width="48" height="14" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="853" y="274" text-anchor="middle" class="arrow-label">request</text>
  <path d="M894 316 H812" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="829" y="318" width="52" height="14" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="855" y="328" text-anchor="middle" class="arrow-label">response</text>

  <!-- State and event flows -->
  <path d="M696 329 V354 H604 V397" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="623" y="344" width="50" height="14" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="648" y="354" text-anchor="middle" class="arrow-label">state I/O</text>
  <path d="M762 329 V377" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <rect x="765" y="344" width="40" height="14" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="785" y="354" text-anchor="middle" class="arrow-label">events</text>

  <!-- Runtime infrastructure -->
  <rect x="408" y="554" width="764" height="116" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6,4"/>
  <text x="422" y="576" class="group-title">RUNTIME INFRASTRUCTURE</text>

  <rect x="438" y="594" width="166" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="521" y="617" text-anchor="middle" class="node-title">Caffeine Local</text>
  <text x="521" y="635" text-anchor="middle" class="node-sub">zero-infrastructure mode</text>

  <ellipse cx="729" cy="604" rx="77" ry="12" fill="#fee2e2" stroke="#dc382d" stroke-width="1.5"/>
  <rect x="652" y="604" width="154" height="29" fill="#fee2e2"/>
  <line x1="652" y1="604" x2="652" y2="633" stroke="#dc382d" stroke-width="1.5"/>
  <line x1="806" y1="604" x2="806" y2="633" stroke="#dc382d" stroke-width="1.5"/>
  <ellipse cx="729" cy="633" rx="77" ry="12" fill="#fecaca" stroke="#dc382d" stroke-width="1.5"/>
  <rect x="668" y="606" width="122" height="18" rx="3" fill="#fee2e2"/>
  <text x="729" y="619" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">Redis Shared State</text>

  <rect x="854" y="594" width="286" height="52" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <circle cx="880" cy="620" r="14" fill="#e6522c"/>
  <text x="880" y="624" text-anchor="middle" class="badge">P</text>
  <text x="997" y="616" text-anchor="middle" class="node-title">Metrics / Traces / Logs</text>
  <text x="997" y="635" text-anchor="middle" class="node-sub">Micrometer + Observation + Actuator</text>

  <path d="M488 449 V594" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M554 449 V538 H729 V592" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M729 449 V530 H997 V594" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>

  <!-- Legend -->
  <g transform="translate(36, 577)">
    <text x="0" y="0" class="group-title">FLOW LEGEND</text>
    <line x1="0" y1="26" x2="34" y2="26" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="44" y="30" class="legend">request / response</text>
    <line x1="0" y1="52" x2="34" y2="52" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <text x="44" y="56" class="legend">state read / write</text>
    <line x1="0" y1="78" x2="34" y2="78" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
    <text x="44" y="82" class="legend">async event</text>
  </g>

  <text x="1164" y="700" text-anchor="end" fill="#9ca3af" font-size="10">Architecture based on llmrix-router v1.0.2</text>
</svg>
