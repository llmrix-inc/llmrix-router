<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" role="img" aria-labelledby="title desc">
  <title id="title">LLMRix request decision sequence</title>
  <desc id="desc">A sequence diagram showing request normalization, eligibility filtering, routing strategy selection, quota and lease acquisition, first model attempt, success, retry before streaming, and no replay after streaming begins.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { fill: #111827; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .participant { fill: #111827; font-size: 13px; font-weight: 700; }
    .participant-sub { fill: #6b7280; font-size: 10px; }
    .message { fill: #374151; font-size: 11px; font-weight: 600; }
    .step { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .frame-title { fill: #374151; font-size: 11px; font-weight: 700; }
    .frame-copy { fill: #4b5563; font-size: 11px; }
    .legend { fill: #4b5563; font-size: 11px; }
    .note { fill: #991b1b; font-size: 11px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="40" y="40" class="title">One Request, One Deterministic Decision Path</text>
  <text x="40" y="64" class="subtitle">Eligibility first, policy second, runtime limits before execution, and stream-safe failover</text>
  <rect x="1190" y="25" width="170" height="35" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1275" y="47" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">REQUEST LIFECYCLE</text>

  <!-- participant headers -->
  <rect x="38" y="102" width="160" height="58" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="131" r="12" fill="#2563eb"/>
  <text x="60" y="135" text-anchor="middle" class="step">1</text>
  <text x="125" y="129" text-anchor="middle" class="participant">Caller</text>
  <text x="125" y="147" text-anchor="middle" class="participant-sub">app / SDK</text>

  <rect x="258" y="102" width="160" height="58" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <circle cx="280" cy="131" r="12" fill="#9333ea"/>
  <text x="280" y="135" text-anchor="middle" class="step">2</text>
  <text x="345" y="129" text-anchor="middle" class="participant">Access Layer</text>
  <text x="345" y="147" text-anchor="middle" class="participant-sub">HTTP / Java API</text>

  <rect x="478" y="102" width="190" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="502" cy="131" r="12" fill="#2563eb"/>
  <text x="502" y="135" text-anchor="middle" class="step">3</text>
  <text x="577" y="129" text-anchor="middle" class="participant">Router Core</text>
  <text x="577" y="147" text-anchor="middle" class="participant-sub">filter / policy / execute</text>

  <rect x="728" y="102" width="160" height="58" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="750" cy="131" r="12" fill="#16a34a"/>
  <text x="750" y="135" text-anchor="middle" class="step">4</text>
  <text x="815" y="129" text-anchor="middle" class="participant">State Store</text>
  <text x="815" y="147" text-anchor="middle" class="participant-sub">local / Redis</text>

  <rect x="948" y="102" width="160" height="58" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="970" cy="131" r="12" fill="#ea580c"/>
  <text x="970" y="135" text-anchor="middle" class="step">5</text>
  <text x="1035" y="129" text-anchor="middle" class="participant">Target A</text>
  <text x="1035" y="147" text-anchor="middle" class="participant-sub">first candidate</text>

  <rect x="1178" y="102" width="160" height="58" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="1200" cy="131" r="12" fill="#ea580c"/>
  <text x="1200" y="135" text-anchor="middle" class="step">6</text>
  <text x="1265" y="129" text-anchor="middle" class="participant">Target B</text>
  <text x="1265" y="147" text-anchor="middle" class="participant-sub">next eligible target</text>

  <!-- lifelines -->
  <line x1="118" y1="160" x2="118" y2="876" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6,5"/>
  <line x1="338" y1="160" x2="338" y2="876" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6,5"/>
  <line x1="573" y1="160" x2="573" y2="876" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="6,5"/>
  <line x1="808" y1="160" x2="808" y2="876" stroke="#86efac" stroke-width="1.4" stroke-dasharray="6,5"/>
  <line x1="1028" y1="160" x2="1028" y2="876" stroke="#fdba74" stroke-width="1.4" stroke-dasharray="6,5"/>
  <line x1="1258" y1="160" x2="1258" y2="876" stroke="#fdba74" stroke-width="1.4" stroke-dasharray="6,5"/>

  <!-- step 1 -->
  <path d="M118 206 H338" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="176" y="190" width="103" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="227" y="203" text-anchor="middle" class="message">route + request</text>

  <!-- step 2 -->
  <path d="M338 258 H573" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="394" y="242" width="126" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="457" y="255" text-anchor="middle" class="message">normalize + validate</text>

  <!-- step 3 core self-loop -->
  <path d="M573 304 H636 V342 H573" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="589" y="297" width="142" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="660" y="310" text-anchor="middle" class="message">filter + rank candidates</text>

  <!-- step 4 state lease -->
  <path d="M573 382 H808" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="620" y="366" width="140" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="690" y="379" text-anchor="middle" class="message">quota + concurrency lease</text>

  <path d="M808 406 H573" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="646" y="390" width="90" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="691" y="403" text-anchor="middle" class="message">lease acquired</text>

  <!-- step 5 target A -->
  <path d="M573 446 H1028" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="764" y="430" width="112" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="820" y="443" text-anchor="middle" class="message">attempt 1</text>

  <!-- step 6 response A -->
  <path d="M1028 486 H573" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="772" y="470" width="140" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="842" y="483" text-anchor="middle" class="message">result or classified error</text>

  <!-- success frame -->
  <rect x="446" y="506" width="884" height="82" rx="8" fill="#f0fdf4" fill-opacity="0.72" stroke="#86efac" stroke-width="1.4"/>
  <rect x="462" y="496" width="103" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="513" y="511" text-anchor="middle" class="frame-title">SUCCESS PATH</text>
  <path d="M573 544 H338" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="380" y="528" width="136" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="448" y="541" text-anchor="middle" class="message">unified response</text>
  <path d="M338 570 H118" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="174" y="554" width="108" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="228" y="567" text-anchor="middle" class="message">response + usage</text>
  <text x="590" y="575" class="frame-copy">Settle usage, update health/latency, release lease, and publish lifecycle events.</text>

  <!-- retry frame -->
  <rect x="446" y="610" width="884" height="122" rx="8" fill="#fff7ed" fill-opacity="0.78" stroke="#fdba74" stroke-width="1.4"/>
  <rect x="462" y="600" width="276" height="22" rx="4" fill="#ffedd5" stroke="#fdba74"/>
  <text x="600" y="615" text-anchor="middle" class="frame-title">RETRY BEFORE FIRST OUTPUT</text>
  <text x="472" y="640" class="frame-copy">When the error is retryable and no data is visible to the caller:</text>
  <path d="M573 664 H808" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <rect x="618" y="648" width="146" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="691" y="661" text-anchor="middle" class="message">record failure + cooldown</text>
  <path d="M573 694 H1258" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="820" y="678" width="156" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="898" y="691" text-anchor="middle" class="message">attempt next candidate</text>
  <path d="M1258 720 H573" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="836" y="704" width="112" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="892" y="717" text-anchor="middle" class="message">target B result</text>

  <!-- stream frame -->
  <rect x="446" y="760" width="884" height="104" rx="8" fill="#faf5ff" fill-opacity="0.82" stroke="#d8b4fe" stroke-width="1.4"/>
  <rect x="462" y="750" width="228" height="22" rx="4" fill="#ede9fe" stroke="#d8b4fe"/>
  <text x="576" y="765" text-anchor="middle" class="frame-title">STREAM ALREADY STARTED</text>
  <path d="M1028 798 H573" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <rect x="760" y="782" width="152" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="836" y="795" text-anchor="middle" class="message">forward visible chunks</text>
  <path d="M573 838 H338" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <rect x="386" y="822" width="136" height="18" rx="3" fill="#ffffff" opacity="0.96"/>
  <text x="454" y="835" text-anchor="middle" class="message">close stream, no replay</text>

  <!-- final rule -->
  <rect x="446" y="886" width="884" height="45" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="474" cy="909" r="12" fill="#dc2626"/>
  <text x="474" y="913" text-anchor="middle" class="step">!</text>
  <text x="500" y="913" class="note">Rule: switch only before the first visible chunk; never replay after output starts.</text>

  <!-- legend -->
  <g transform="translate(40, 720)">
    <text x="0" y="0" class="frame-title">FLOW LEGEND</text>
    <line x1="0" y1="26" x2="38" y2="26" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="49" y="30" class="legend">request / response</text>
    <line x1="0" y1="54" x2="38" y2="54" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="49" y="58" class="legend">state / success</text>
    <line x1="0" y1="82" x2="38" y2="82" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="49" y="86" class="legend">retry / cooldown</text>
    <line x1="0" y1="110" x2="38" y2="110" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
    <text x="49" y="114" class="legend">stream / async signal</text>
  </g>

  <text x="1360" y="945" text-anchor="end" fill="#9ca3af" font-size="10">Decision sequence based on llmrix-router v1.0.2</text>
</svg>
