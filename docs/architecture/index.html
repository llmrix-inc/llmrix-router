<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>LLMRix Model Router Architecture</title>
  <style>
    :root{color-scheme:dark;--bg:#050d18;--panel:#0a1628;--line:#163451;--cyan:#48cae4;--text:#caf0f8;--muted:#7fb7c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#081321}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #00b4d8;color:var(--cyan);font:700 12px ui-monospace,monospace;box-shadow:0 0 18px #00b4d833}h1{margin:0;font-size:15px;letter-spacing:0}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}nav{display:flex;gap:6px}button,a.tool{min-width:36px;height:36px;padding:0 8px;display:grid;place-items:center;border:1px solid var(--line);background:#0d1f3c;color:var(--text);text-decoration:none;cursor:pointer;font-size:16px;border-radius:4px}button:hover,a.tool:hover{border-color:#00b4d8;color:#fff;background:#102b50}main{height:calc(100vh - 64px);padding:18px;overflow:hidden}.viewport{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 18px 60px #0008}.canvas{width:100%;height:100%;transform-origin:center;transition:transform .16s ease}object{width:100%;height:100%;display:block}.status{position:absolute;left:14px;bottom:12px;padding:7px 10px;background:#081321e8;border:1px solid var(--line);color:var(--muted);font:11px ui-monospace,monospace;pointer-events:none}@media(max-width:720px){header{padding:0 12px}.subtitle{display:none}main{padding:8px}a.tool{display:none}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="mark">LX</div><div><h1>LLMRix Model Router Architecture</h1><div class="subtitle">Multi-model routing and orchestration runtime</div></div></div>
    <nav aria-label="Diagram controls">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><button id="reset" title="Reset zoom" aria-label="Reset zoom">↺</button><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button><button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      <a class="tool" href="llmrix-architecture.svg" download title="Download SVG" aria-label="Download SVG">SVG</a>
    </nav>
  </header>
  <main><section class="viewport" id="viewport" aria-label="LLMRix architecture diagram"><div class="canvas" id="canvas"><object data="llmrix-architecture.svg" type="image/svg+xml">LLMRix architecture diagram</object></div><div class="status" id="status">100% · ARCH-001 · RUNTIME VIEW</div></section></main>
  <script>
    const canvas=document.getElementById('canvas'),status=document.getElementById('status'),viewport=document.getElementById('viewport');let scale=1;const render=()=>{canvas.style.transform=`scale(${scale})`;status.textContent=`${Math.round(scale*100)}% · ARCH-001 · RUNTIME VIEW`};document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2,scale+.1);render()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.5,scale-.1);render()};document.getElementById('reset').onclick=()=>{scale=1;render()};document.getElementById('fullscreen').onclick=()=>viewport.requestFullscreen?.();viewport.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();scale=Math.max(.5,Math.min(2,scale+(e.deltaY<0?.08:-.08)));render()},{passive:false});
  </script>
</body>
</html>
