<rect width="1440" height="950" fill="#081321"/><rect width="1440" height="950" fill="url(#grid)" opacity=".8"/><rect width="1440" height="5" fill="#00b4d8"/>
<text x="42" y="44" font-size="25" font-weight="800" fill="#fff">LLMRix Model Router</text><text x="42" y="67" font-size="11" class="mono" fill="#48cae4">PROVIDER-NEUTRAL MULTIMODAL ROUTING / RUNTIME ARCHITECTURE</text><text x="1398" y="44" text-anchor="end" font-size="10" class="mono">JAVA 17+ · SPRING BOOT 3.x · OPENAI COMPATIBLE</text>

<!-- layer containers -->
<rect class="lane" x="34" y="88" width="1372" height="98"/><text class="lt" x="49" y="109">01 / CONSUMERS</text>
<rect class="lane" x="34" y="202" width="1372" height="156"/><text class="lt" x="49" y="223">02 / ACCESS &amp; PROTOCOL</text>
<rect class="lane" x="34" y="374" width="1372" height="238"/><text class="lt" x="49" y="395">03 / ROUTER-CORE</text>
<rect class="lane" x="34" y="628" width="664" height="164"/><text class="lt" x="49" y="649">04A / STATE &amp; HEALTH</text>
<rect class="lane" x="716" y="628" width="690" height="164"/><text class="lt" x="731" y="649">04B / ROUTER-COMPONENTS / INTEGRATIONS</text>
<rect class="lane" x="34" y="808" width="1372" height="96"/><text class="lt" x="49" y="829">05 / OPERATIONS &amp; FEEDBACK</text>

<!-- consumers -->
