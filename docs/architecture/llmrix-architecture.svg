<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">LLMRix Model Router architecture</title><desc id="desc">Provider-neutral routing core with OpenAI-compatible HTTP access, multimodal APIs, model integrations, state, and observability.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#caf0f8}.mono{font-family:"SFMono-Regular",Consolas,monospace}.lt{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#48cae4}.nt{font-size:14px;font-weight:750;fill:#f8fdff}.ns{font-size:10.5px;fill:#90e0ef}.an{font-size:9px;fill:#48cae4}.lane{fill:#0d1f3c;fill-opacity:.62;stroke:#1d4f72;stroke-dasharray:7 5}.n{fill:#102744;stroke:#00b4d8;stroke-width:1.2}.core{fill:#102b50;stroke:#48cae4;stroke-width:1.5}.policy{fill:#172554;stroke:#818cf8;stroke-width:1.2}.state{fill:#0b302d;stroke:#06d6a0;stroke-width:1.2}.provider{fill:#342414;stroke:#f77f00;stroke-width:1.2}.observe{fill:#301a3d;stroke:#c084fc;stroke-width:1.2}.p{fill:none;stroke:#48cae4;stroke-width:2.2;marker-end:url(#ac)}.c{fill:none;stroke:#f77f00;stroke-width:1.6;marker-end:url(#ao)}.s{fill:none;stroke:#06d6a0;stroke-width:1.7;marker-end:url(#ag)}.e{fill:none;stroke:#a78bfa;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#ap)}.f{fill:none;stroke:#f472b6;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#af)}
</style>
