<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">LLMRix Model Router runtime architecture</title><desc id="desc">Production architecture for multi-model routing and orchestration.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#caf0f8}.mono{font-family:"SFMono-Regular",Consolas,monospace}.lt{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#48cae4}.nt{font-size:14px;font-weight:750;fill:#f8fdff}.ns{font-size:10.5px;fill:#90e0ef}.an{font-size:9px;fill:#48cae4}.lane{fill:#0d1f3c;fill-opacity:.62;stroke:#1d4f72;stroke-dasharray:7 5}.n{fill:#102744;stroke:#00b4d8;stroke-width:1.2}.policy{fill:#172554;stroke:#818cf8;stroke-width:1.2}.state{fill:#0b302d;stroke:#06d6a0;stroke-width:1.2}.provider{fill:#342414;stroke:#f77f00;stroke-width:1.2}.observe{fill:#301a3d;stroke:#c084fc;stroke-width:1.2}.p{fill:none;stroke:#48cae4;stroke-width:2.2;marker-end:url(#ac)}.c{fill:none;stroke:#f77f00;stroke-width:1.6;marker-end:url(#ao)}.s{fill:none;stroke:#06d6a0;stroke-width:1.7;marker-end:url(#ag)}.e{fill:none;stroke:#a78bfa;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#ap)}.f{fill:none;stroke:#f472b6;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#af)}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#112240" stroke-width=".6"/></pattern>
<linearGradient id="hero" x2="1" y2="1"><stop stop-color="#102b50"/><stop offset="1" stop-color="#111b3d"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#48cae4"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#f77f00"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#06d6a0"/></marker><marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#a78bfa"/></marker><marker id="af" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#f472b6"/></marker>
</defs>
<rect width="1440" height="900" fill="#081321"/><rect width="1440" height="900" fill="url(#grid)" opacity=".8"/><rect width="1440" height="5" fill="#00b4d8"/>
<text x="42" y="44" font-size="25" font-weight="800" fill="#fff">LLMRix Model Router</text><text x="42" y="67" font-size="11" class="mono" fill="#48cae4">MULTI-MODEL ROUTING + ORCHESTRATION / RUNTIME ARCHITECTURE</text><text x="1398" y="44" text-anchor="end" font-size="10" class="mono">JAVA 17+ · SPRING BOOT 3.x · OPENAI COMPATIBLE</text>

<!-- layer containers -->
<rect class="lane" x="34" y="90" width="1372" height="106"/><text class="lt" x="49" y="111">01 / CONSUMERS</text>
<rect class="lane" x="34" y="212" width="1372" height="128"/><text class="lt" x="49" y="233">02 / ACCESS &amp; PROTOCOL</text>
<rect class="lane" x="34" y="356" width="1372" height="195"/><text class="lt" x="49" y="377">03 / ROUTING &amp; EXECUTION CORE</text>
<rect class="lane" x="34" y="567" width="670" height="170"/><text class="lt" x="49" y="588">04A / RUNTIME STATE</text>
<rect class="lane" x="720" y="567" width="686" height="170"/><text class="lt" x="735" y="588">04B / PROVIDER INTEGRATIONS</text>
<rect class="lane" x="34" y="753" width="1372" height="92"/><text class="lt" x="49" y="774">05 / OPERATIONS &amp; FEEDBACK</text>

<!-- consumers -->
<g><rect class="n" x="92" y="126" width="240" height="50" rx="3"/><circle cx="115" cy="151" r="9" fill="#00b4d8"/><text class="nt" x="135" y="148">Embedded Java</text><text class="ns" x="135" y="164">Agent · RAG · application services</text></g>
<g><rect class="n" x="414" y="126" width="240" height="50" rx="3"/><circle cx="437" cy="151" r="9" fill="#6db33f"/><text class="nt" x="457" y="148">Spring Ecosystem</text><text class="ns" x="457" y="164">Spring Boot · Spring AI</text></g>
<g><rect class="n" x="736" y="126" width="240" height="50" rx="3"/><circle cx="759" cy="151" r="9" fill="#8b5cf6"/><text class="nt" x="779" y="148">LangChain4j</text><text class="ns" x="779" y="164">Existing model implementations</text></g>
<g><rect class="n" x="1058" y="126" width="290" height="50" rx="3"/><circle cx="1081" cy="151" r="9" fill="#10a37f"/><text class="nt" x="1101" y="148">Remote Consumers</text><text class="ns" x="1101" y="164">OpenAI SDK · Orion · non-Java</text></g>

<!-- access -->
<g><rect class="n" x="92" y="255" width="240" height="62" rx="3"/><text class="nt" x="212" y="280" text-anchor="middle">Core ChatModel API</text><text class="ns" x="212" y="300" text-anchor="middle">sync · async · Flow.Publisher</text></g>
<g><rect class="n" x="414" y="255" width="240" height="62" rx="3"/><text class="nt" x="534" y="280" text-anchor="middle">Router Spring Starter</text><text class="ns" x="534" y="300" text-anchor="middle">properties · auto-config · metadata</text></g>
<g><rect class="n" x="736" y="255" width="240" height="62" rx="3"/><text class="nt" x="856" y="280" text-anchor="middle">Orion Client SDK</text><text class="ns" x="856" y="300" text-anchor="middle">plain Java + Spring Starter</text></g>
<g><polygon points="1203 246,1338 267,1338 305,1203 326,1068 305,1068 267" fill="#102744" stroke="#00b4d8" stroke-width="1.2"/><text class="nt" x="1203" y="280" text-anchor="middle">OpenAI-Compatible Server</text><text class="ns" x="1203" y="300" text-anchor="middle">auth · request ID · HTTP/SSE · errors</text></g>

<!-- core -->
<g filter="url(#glow)"><rect x="70" y="401" width="220" height="116" rx="4" fill="url(#hero)" stroke="#48cae4" stroke-width="1.7"/><text class="nt" x="180" y="430" text-anchor="middle">Eligibility Filter</text><text class="ns" x="180" y="453" text-anchor="middle">capability · allow/deny · context</text><text class="ns" x="180" y="472" text-anchor="middle">cost · latency · health · quota</text><text class="an mono" x="180" y="498" text-anchor="middle">DETERMINISTIC GATE</text></g>
<g><polygon points="430 397,550 431,550 487,430 521,310 487,310 431" fill="#172554" stroke="#818cf8" stroke-width="1.4"/><text class="nt" x="430" y="444" text-anchor="middle">Routing Strategy</text><text class="ns" x="430" y="465" text-anchor="middle">priority · RR · weighted · balanced</text><text class="ns" x="430" y="483" text-anchor="middle">semantic · contextual bandit</text><text class="an mono" x="430" y="503" text-anchor="middle">ORDER CANDIDATES</text></g>
<g filter="url(#glow)"><rect x="575" y="401" width="250" height="116" rx="4" fill="url(#hero)" stroke="#48cae4" stroke-width="1.7"/><text class="nt" x="700" y="430" text-anchor="middle">Attempt Executor</text><text class="ns" x="700" y="453" text-anchor="middle">total + per-attempt timeout</text><text class="ns" x="700" y="472" text-anchor="middle">retry · fallback · cancel · stream commit</text><text class="an mono" x="700" y="498" text-anchor="middle">CORRECTNESS BOUNDARY</text></g>
<g><rect class="policy" x="855" y="401" width="210" height="116" rx="3"/><text class="nt" x="960" y="430" text-anchor="middle">Fugu Orchestrator</text><text class="ns" x="960" y="453" text-anchor="middle">candidate / role policy</text><text class="ns" x="960" y="472" text-anchor="middle">solver · reviewer · bounded turns</text><text class="an mono" x="960" y="498" text-anchor="middle">OPTIONAL WORKFLOW</text></g>
<g><rect class="policy" x="1092" y="401" width="270" height="116" rx="3"/><text class="nt" x="1227" y="430" text-anchor="middle">Evaluation &amp; Shadow</text><text class="ns" x="1227" y="453" text-anchor="middle">offline replay · A/B baseline</text><text class="ns" x="1227" y="472" text-anchor="middle">sampled shadow · isolated resources</text><text class="an mono" x="1227" y="498" text-anchor="middle">NO PRIMARY IMPACT</text></g>

<!-- state -->
<g><rect class="state" x="70" y="610" width="180" height="90" rx="3" stroke-dasharray="6 3"/><text class="nt" x="160" y="641" text-anchor="middle">Local Store</text><text class="ns" x="160" y="664" text-anchor="middle">zero infrastructure</text><text class="ns" x="160" y="683" text-anchor="middle">single JVM semantics</text></g>
<g><ellipse cx="365" cy="621" rx="94" ry="14" fill="#0b302d" stroke="#06d6a0"/><rect x="271" y="621" width="188" height="65" fill="#0b302d"/><path d="M271 621v65M459 621v65" stroke="#06d6a0"/><ellipse cx="365" cy="686" rx="94" ry="14" fill="#082522" stroke="#06d6a0"/><text class="nt" x="365" y="648" text-anchor="middle">Redis State Store</text><text class="ns" x="365" y="670" text-anchor="middle">Lettuce · atomic Lua · fail-closed</text></g>
<g><rect class="state" x="480" y="610" width="190" height="90" rx="3"/><text class="nt" x="575" y="641" text-anchor="middle">State Contracts</text><text class="ns" x="575" y="664" text-anchor="middle">health · cooldown · lease</text><text class="ns" x="575" y="683" text-anchor="middle">RPM · TPM · bandit reward</text></g>

<!-- providers -->
<g><rect class="provider" x="750" y="610" width="140" height="90" rx="3"/><circle cx="820" cy="634" r="12" fill="#10a37f"/><text x="820" y="638" text-anchor="middle" font-size="8" font-weight="800">OAI</text><text class="nt" x="820" y="665" text-anchor="middle">OpenAI</text><text class="ns" x="820" y="683" text-anchor="middle">compatible APIs</text></g>
<g><rect class="provider" x="905" y="610" width="140" height="90" rx="3"/><circle cx="975" cy="634" r="12" fill="#f77f00"/><text x="975" y="638" text-anchor="middle" font-size="8" font-weight="800">LLM</text><text class="nt" x="975" y="665" text-anchor="middle">Self-hosted</text><text class="ns" x="975" y="683" text-anchor="middle">vLLM · Higress</text></g>
<g><rect class="provider" x="1060" y="610" width="140" height="90" rx="3"/><circle cx="1130" cy="634" r="12" fill="#6db33f"/><text x="1130" y="638" text-anchor="middle" font-size="8" font-weight="800">SAI</text><text class="nt" x="1130" y="665" text-anchor="middle">Spring AI</text><text class="ns" x="1130" y="683" text-anchor="middle">bidirectional</text></g>
<g><rect class="provider" x="1215" y="610" width="155" height="90" rx="3"/><circle cx="1292" cy="634" r="12" fill="#8b5cf6"/><text x="1292" y="638" text-anchor="middle" font-size="7" font-weight="800">LC4J</text><text class="nt" x="1292" y="665" text-anchor="middle">LangChain4j</text><text class="ns" x="1292" y="683" text-anchor="middle">+ custom model SPI</text></g>

<!-- operations -->
<g><rect class="observe" x="170" y="785" width="260" height="42" rx="3"/><text class="nt" x="300" y="803" text-anchor="middle">Lifecycle Events</text><text class="ns" x="300" y="819" text-anchor="middle">Router · Fugu · Orion listeners</text></g>
<g><rect class="observe" x="505" y="785" width="310" height="42" rx="3"/><text class="nt" x="660" y="803" text-anchor="middle">Micrometer + Observation</text><text class="ns" x="660" y="819" text-anchor="middle">metrics · first token · request correlation</text></g>
<g><rect class="observe" x="890" y="785" width="380" height="42" rx="3"/><text class="nt" x="1080" y="803" text-anchor="middle">Deployment Integrations</text><text class="ns" x="1080" y="819" text-anchor="middle">Actuator · OTel · external IAM · gateway</text></g>

