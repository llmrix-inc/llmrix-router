<g><rect class="observe" x="462" y="850" width="340" height="38" rx="3"/><text class="nt" x="632" y="867" text-anchor="middle">Micrometer + Observation</text><text class="ns" x="632" y="882" text-anchor="middle">latency · tokens · cost · request correlation</text></g>
<g><rect class="observe" x="872" y="850" width="476" height="38" rx="3"/><text class="nt" x="1110" y="867" text-anchor="middle">Deployment &amp; Diagnostics</text><text class="ns" x="1110" y="882" text-anchor="middle">Actuator · logs · external IAM · health endpoint</text></g>

