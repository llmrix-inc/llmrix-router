<g><rect class="shared" x="70" y="1274" width="250" height="94" rx="4"/><text class="nt" x="195" y="1298" text-anchor="middle">Shared contract surface</text><text class="ns" x="195" y="1318" text-anchor="middle">Chat · Responses · Embedding · Rerank</text><text class="ns" x="195" y="1337" text-anchor="middle">Audio · Image · Video · streaming</text><text class="an mono" x="195" y="1356" text-anchor="middle">llmrix-model-open</text></g>
<g><rect class="provider" x="350" y="1274" width="230" height="94" rx="4"/><text class="nt" x="465" y="1298" text-anchor="middle">OpenAI</text><text class="ns" x="465" y="1318" text-anchor="middle">chat · embeddings · rerank</text><text class="ns" x="465" y="1337" text-anchor="middle">audio · image · video</text><text class="an mono" x="465" y="1356" text-anchor="middle">OPENAI-COMPATIBLE</text></g>
