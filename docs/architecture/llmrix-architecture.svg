<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1500" role="img" aria-labelledby="title desc">
<title id="title">LLMRix Model Router architecture</title>
<desc id="desc">Panoramic LLMRix runtime view: one shared llmrix-model-open module separates provider-neutral model contracts from the Router runtime and Orion client. Requests enter through the OpenAI-compatible API or embedded Java facade, pass authentication, routing context, candidate filtering and strategy selection, then execute against provider integrations with routing hints filtered at the provider boundary by default.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#caf0f8}.mono{font-family:"SFMono-Regular",Consolas,monospace}.lt{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#48cae4}.nt{font-size:14px;font-weight:750;fill:#f8fdff}.ns{font-size:10.5px;fill:#90e0ef}.an{font-size:9px;fill:#48cae4}.lane{fill:#0d1f3c;fill-opacity:.62;stroke:#1d4f72;stroke-dasharray:7 5}.n{fill:#102744;stroke:#00b4d8;stroke-width:1.2}.core{fill:#102b50;stroke:#48cae4;stroke-width:1.5}.shared{fill:#12352f;stroke:#06d6a0;stroke-width:1.6}.policy{fill:#172554;stroke:#818cf8;stroke-width:1.2}.state{fill:#0b302d;stroke:#06d6a0;stroke-width:1.2}.provider{fill:#342414;stroke:#f77f00;stroke-width:1.2}.observe{fill:#301a3d;stroke:#c084fc;stroke-width:1.2}.p{fill:none;stroke:#48cae4;stroke-width:2.2;marker-end:url(#ac)}.c{fill:none;stroke:#f77f00;stroke-width:1.6;marker-end:url(#ao)}.s{fill:none;stroke:#06d6a0;stroke-width:1.7;marker-end:url(#ag)}.e{fill:none;stroke:#a78bfa;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#ap)}.f{fill:none;stroke:#f472b6;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#af)}.d{fill:none;stroke:#818cf8;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#ad)}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#112240" stroke-width=".6"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#48cae4"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#f77f00"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#06d6a0"/></marker><marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#a78bfa"/></marker><marker id="af" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#f472b6"/></marker><marker id="ad" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0l10 4-10 4z" fill="#818cf8"/></marker>
</defs>
<rect width="1440" height="1500" fill="#081321"/><rect width="1440" height="1500" fill="url(#grid)" opacity=".8"/><rect width="1440" height="5" fill="#00b4d8"/>
<text x="42" y="44" font-size="25" font-weight="800" fill="#fff">LLMRix Model Router</text><text x="42" y="67" font-size="11" class="mono" fill="#48cae4">SHARED CONTRACTS / ROUTER RUNTIME / PROVIDER BOUNDARY</text><text x="1398" y="44" text-anchor="end" font-size="10" class="mono">JAVA 17+ · SPRING BOOT 3.x · OPENAI COMPATIBLE</text>

<!-- layer containers -->
<rect class="lane" x="34" y="88" width="1372" height="112"/><text class="lt" x="49" y="109">01 / CONSUMERS</text>
<rect class="lane" x="34" y="216" width="1372" height="174"/><text class="lt" x="49" y="237">02 / ACCESS &amp; PROTOCOL</text>
<rect class="lane" x="34" y="406" width="1372" height="220"/><text class="lt" x="49" y="427">03 / ROUTER RUNTIME</text>
<rect class="lane" x="34" y="638" width="1372" height="178"/><text class="lt" x="49" y="659">04 / SHARED MODULE (ONE ARTIFACT)</text>
<rect class="lane" x="34" y="832" width="1372" height="142"/><text class="lt" x="49" y="853">05 / STATE, PROVIDERS &amp; OPERATIONS</text>

<!-- consumers -->
<g><rect class="n" x="70" y="126" width="390" height="54" rx="3"/><circle cx="97" cy="153" r="10" fill="#6db33f"/><text class="nt" x="119" y="150">Embedded Java Applications</text><text class="ns" x="119" y="167">LlmRouter · builder · application services</text></g>
<g><rect class="n" x="525" y="126" width="390" height="54" rx="3"/><circle cx="552" cy="153" r="10" fill="#00b4d8"/><text class="nt" x="574" y="150">Orion Model Client</text><text class="ns" x="574" y="167">framework-neutral Java client · request options · listeners</text></g>
<g><rect class="n" x="980" y="126" width="390" height="54" rx="3"/><circle cx="1007" cy="153" r="10" fill="#10a37f"/><text class="nt" x="1029" y="150">OpenAI SDK / curl / Python</text><text class="ns" x="1029" y="167">any OpenAI-compatible remote client</text></g>

<!-- access and protocol -->
<g><rect class="n" x="70" y="260" width="390" height="92" rx="3"/><text class="nt" x="265" y="289" text-anchor="middle">Router Spring Starter</text><text class="ns" x="265" y="310" text-anchor="middle">auto-configuration · YAML / properties</text><text class="ns" x="265" y="328" text-anchor="middle">HTTP enable switch · auth · request ID</text><text class="an mono" x="265" y="345" text-anchor="middle">STARTER DEPENDS ON CORE + INTEGRATIONS</text></g>
<g><polygon points="1110 250,1370 270,1370 342,1110 362,850 342,850 270" fill="#102744" stroke="#00b4d8" stroke-width="1.2"/><text class="nt" x="1110" y="283" text-anchor="middle">OpenAI-Compatible HTTP API</text><text class="ns" x="1110" y="303" text-anchor="middle">auth · JSON · SSE · unified errors</text><text class="an mono" x="1110" y="322" text-anchor="middle">/v1/models · /v1/chat/completions · /v1/responses · /v1/embeddings · /v1/rerank</text><text class="an mono" x="1110" y="338" text-anchor="middle">/v1/audio/* · /v1/images/* · /v1/videos · retrieve · content · delete · remix</text></g>
<g><rect class="policy" x="70" y="367" width="1300" height="1" opacity=".2"/><text class="an mono" x="88" y="382">PRIVATE REQUEST CONTEXT</text><text class="ns" x="245" y="382">X-LLMRix-Routing-Hints may enter from Client → Router; provider hop strips it by default</text><text class="ns" x="1045" y="382">forward-routing-hints: true enables explicit forwarding</text></g>

<!-- shared module -->
<g filter="url(#glow)"><rect class="shared" x="70" y="670" width="1300" height="116" rx="5"/><text class="nt" x="100" y="699">llmrix-model-open</text><text class="an mono" x="100" y="717">ONE SHARED MAVEN MODULE · REUSED BY ORION CLIENT + ROUTER CORE + INTEGRATIONS</text></g>
<g><rect class="core" x="100" y="734" width="260" height="34" rx="3"/><text class="ns" x="230" y="755" text-anchor="middle">provider-neutral API contracts</text></g><g><rect class="core" x="390" y="734" width="260" height="34" rx="3"/><text class="ns" x="520" y="755" text-anchor="middle">ModelClient + modalities</text></g><g><rect class="core" x="680" y="734" width="300" height="34" rx="3"/><text class="ns" x="830" y="755" text-anchor="middle">OpenAI transport / adapters</text></g><g><rect class="policy" x="1010" y="734" width="330" height="34" rx="3"/><text class="ns" x="1175" y="755" text-anchor="middle">RoutingHints + shared exceptions</text></g>

<!-- router runtime -->
<g filter="url(#glow)"><rect class="core" x="70" y="450" width="620" height="132" rx="4"/><text class="nt" x="380" y="479" text-anchor="middle">llmrix-model-router-core</text><text class="ns" x="380" y="501" text-anchor="middle">route registry · model targets · provider SPI</text><text class="ns" x="380" y="520" text-anchor="middle">eligibility · priority / balanced / cost / latency</text><text class="ns" x="380" y="539" text-anchor="middle">timeout · retry · quota · health · stream commit</text><text class="an mono" x="380" y="562" text-anchor="middle">EXECUTION ENGINE / PROVIDER-NEUTRAL</text></g>
<g><rect class="provider" x="750" y="450" width="620" height="132" rx="4"/><text class="nt" x="1060" y="479" text-anchor="middle">llmrix-model-router-integrations</text><text class="ns" x="1060" y="501" text-anchor="middle">provider registrations · OpenAI-compatible transport</text><text class="ns" x="1060" y="520" text-anchor="middle">OpenAI · DeepSeek · OpenRouter · Ollama</text><text class="ns" x="1060" y="539" text-anchor="middle">Redis · Bucket4j · ONNX · validation · evaluation / shadow / Fugu</text><text class="an mono" x="1060" y="562" text-anchor="middle">ADAPTERS / STATE / POLICY / FEEDBACK</text></g>

<!-- state, provider and operations -->
<g><rect class="state" x="70" y="878" width="390" height="72" rx="3"/><text class="nt" x="265" y="906" text-anchor="middle">State &amp; Quota</text><text class="ns" x="265" y="927" text-anchor="middle">local or Redis · cooldown · leases · usage settlement</text></g><g><rect class="provider" x="525" y="878" width="390" height="72" rx="3"/><text class="nt" x="720" y="906" text-anchor="middle">Provider Targets</text><text class="ns" x="720" y="927" text-anchor="middle">capabilities · auth · cost · limits · model health</text></g><g><rect class="observe" x="980" y="878" width="390" height="72" rx="3"/><text class="nt" x="1175" y="906" text-anchor="middle">Operations &amp; Feedback</text><text class="ns" x="1175" y="927" text-anchor="middle">Micrometer · logs · lifecycle events · outcomes · Actuator</text></g>

<!-- detailed runtime lifecycle -->
<rect class="lane" x="34" y="990" width="1372" height="220"/><text class="lt" x="49" y="1011">06 / REQUEST LIFECYCLE &amp; DECISION GATE</text>
<g><rect class="core" x="70" y="1040" width="240" height="82" rx="4"/><text class="nt" x="190" y="1064" text-anchor="middle">1 · Normalize + Auth</text><text class="ns" x="190" y="1084" text-anchor="middle">parse JSON / multipart / SSE</text><text class="ns" x="190" y="1102" text-anchor="middle">API key · request ID</text></g>
<g><rect class="policy" x="340" y="1040" width="240" height="82" rx="4"/><text class="nt" x="460" y="1064" text-anchor="middle">2 · Build Context</text><text class="ns" x="460" y="1084" text-anchor="middle">RoutingHints + principal</text><text class="ns" x="460" y="1102" text-anchor="middle">quota key · model request</text></g>
<g><rect class="core" x="610" y="1040" width="240" height="82" rx="4"/><text class="nt" x="730" y="1064" text-anchor="middle">3 · Filter Candidates</text><text class="ns" x="730" y="1084" text-anchor="middle">operation · tags · modality</text><text class="ns" x="730" y="1102" text-anchor="middle">health · limits · eligibility</text></g>
<g><rect class="policy" x="880" y="1040" width="240" height="82" rx="4"/><text class="nt" x="1000" y="1064" text-anchor="middle">4 · Select Strategy</text><text class="ns" x="1000" y="1084" text-anchor="middle">priority · round-robin · weight</text><text class="ns" x="1000" y="1102" text-anchor="middle">balanced · cache · semantic · bandit</text></g>
<g><rect class="state" x="1150" y="1040" width="220" height="82" rx="4"/><text class="nt" x="1260" y="1064" text-anchor="middle">5 · Execute + Settle</text><text class="ns" x="1260" y="1084" text-anchor="middle">deadline · retry · stream</text><text class="ns" x="1260" y="1102" text-anchor="middle">cooldown · quota · usage</text></g>
<path class="p" d="M310 1081h30"/><path class="p" d="M580 1081h30"/><path class="p" d="M850 1081h30"/><path class="p" d="M1120 1081h30"/>
<text class="an mono" x="70" y="1160">FAILURE PATH</text><text class="ns" x="170" y="1160">target failure → health update → cooldown / next eligible candidate → status-preserving error</text><text class="an mono" x="70" y="1184">SUCCESS PATH</text><text class="ns" x="170" y="1184">response / stream → usage recorded → lifecycle event → Micrometer observation</text>

