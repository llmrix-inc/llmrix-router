<g><rect class="n" x="462" y="123" width="300" height="48" rx="3"/><circle cx="486" cy="147" r="9" fill="#6db33f"/><text class="nt" x="507" y="144">Spring Boot Applications</text><text class="ns" x="507" y="160">starter auto-configuration and properties</text></g>
<g><rect class="n" x="832" y="123" width="516" height="48" rx="3"/><circle cx="856" cy="147" r="9" fill="#10a37f"/><text class="nt" x="877" y="144">Remote Clients</text><text class="ns" x="877" y="160">OpenAI SDK · curl · Python · other OpenAI-compatible clients</text></g>

<!-- access and protocol -->
<g><rect class="n" x="92" y="248" width="300" height="74" rx="3"/><text class="nt" x="242" y="274" text-anchor="middle">Core Java API</text><text class="ns" x="242" y="294" text-anchor="middle">Chat · Embedding · Audio</text><text class="ns" x="242" y="310" text-anchor="middle">Image · Video · streaming</text></g>
<g><rect class="n" x="462" y="248" width="300" height="74" rx="3"/><text class="nt" x="612" y="274" text-anchor="middle">Router Spring Starter</text><text class="ns" x="612" y="294" text-anchor="middle">auto-config · YAML / properties</text><text class="ns" x="612" y="310" text-anchor="middle">HTTP enable switch · request ID</text></g>
<g><polygon points="1110 241,1348 259,1348 311,1110 329,872 311,872 259" fill="#102744" stroke="#00b4d8" stroke-width="1.2"/><text class="nt" x="1110" y="276" text-anchor="middle">OpenAI-Compatible HTTP API</text><text class="ns" x="1110" y="296" text-anchor="middle">auth · JSON · SSE · unified errors</text><text class="an mono" x="1110" y="315" text-anchor="middle">/v1/models · /v1/chat/completions · /v1/responses</text></g>
<g><rect class="policy" x="92" y="337" width="1256" height="1" opacity=".2"/><text class="an mono" x="110" y="350">MODALITY CONTENT</text><text class="ns" x="242" y="350">text · image URL / base64 · video URL / base64 · input audio · file / PDF</text><text class="ns" x="960" y="350">embeddings · transcription · speech · image generation · video lifecycle</text></g>

<!-- core -->
<g filter="url(#glow)"><rect class="core" x="70" y="422" width="245" height="142" rx="4"/><text class="nt" x="192" y="451" text-anchor="middle">API Contracts</text><text class="ns" x="192" y="474" text-anchor="middle">chat · responses · embeddings</text><text class="ns" x="192" y="493" text-anchor="middle">audio · images · videos</text><text class="ns" x="192" y="512" text-anchor="middle">messages · tools · content parts</text><text class="an mono" x="192" y="541" text-anchor="middle">PROVIDER-NEUTRAL TYPES</text></g>
<g><rect class="core" x="345" y="422" width="245" height="142" rx="4"/><text class="nt" x="467" y="451" text-anchor="middle">Runtime Facade</text><text class="ns" x="467" y="474" text-anchor="middle">LlmRouter · LlmRouterBuilder</text><text class="ns" x="467" y="493" text-anchor="middle">route registry · model targets</text><text class="ns" x="467" y="512" text-anchor="middle">sync · async · Flow.Publisher</text><text class="an mono" x="467" y="541" text-anchor="middle">PROGRAMMATIC OR CONFIGURED</text></g>
<g filter="url(#glow)"><rect class="core" x="620" y="422" width="300" height="142" rx="4"/><text class="nt" x="770" y="451" text-anchor="middle">Routing &amp; Execution</text><text class="ns" x="770" y="474" text-anchor="middle">tag / capability eligibility</text><text class="ns" x="770" y="493" text-anchor="middle">priority · balanced · cost · latency</text><text class="ns" x="770" y="512" text-anchor="middle">timeout · retry · cancel · stream commit</text><text class="an mono" x="770" y="541" text-anchor="middle">NO VALID MODEL = MODEL UNAVAILABLE</text></g>
<g><rect class="policy" x="950" y="422" width="190" height="142" rx="3"/><text class="nt" x="1045" y="451" text-anchor="middle">Model Catalog</text><text class="ns" x="1045" y="474" text-anchor="middle">integrations</text><text class="ns" x="1045" y="493" text-anchor="middle">models + tags</text><text class="ns" x="1045" y="512" text-anchor="middle">pricing · limits</text><text class="an mono" x="1045" y="541" text-anchor="middle">EXPLICIT ROUTES</text></g>
<g><rect class="policy" x="1170" y="422" width="190" height="142" rx="3"/><text class="nt" x="1265" y="451" text-anchor="middle">Errors &amp; Events</text><text class="ns" x="1265" y="474" text-anchor="middle">status-preserving</text><text class="ns" x="1265" y="493" text-anchor="middle">application errors</text><text class="ns" x="1265" y="512" text-anchor="middle">listeners · request ID</text><text class="an mono" x="1265" y="541" text-anchor="middle">CONSISTENT CONTRACT</text></g>

<!-- state -->
<g><rect class="state" x="70" y="670" width="180" height="90" rx="3"/><text class="nt" x="160" y="700" text-anchor="middle">Local State</text><text class="ns" x="160" y="722" text-anchor="middle">in-memory store</text><text class="ns" x="160" y="741" text-anchor="middle">single JVM default</text></g>
<g><rect class="state" x="270" y="670" width="180" height="90" rx="3"/><text class="nt" x="360" y="700" text-anchor="middle">Redis State</text><text class="ns" x="360" y="722" text-anchor="middle">shared health / quota</text><text class="ns" x="360" y="741" text-anchor="middle">multi-instance option</text></g>
<g><rect class="state" x="470" y="670" width="190" height="90" rx="3"/><text class="nt" x="565" y="700" text-anchor="middle">State Contracts</text><text class="ns" x="565" y="722" text-anchor="middle">health · cooldown · quota</text><text class="ns" x="565" y="741" text-anchor="middle">lease · usage settlement</text></g>

<!-- integrations -->
<g><rect class="provider" x="750" y="670" width="190" height="90" rx="3"/><circle cx="845" cy="694" r="12" fill="#10a37f"/><text x="845" y="698" text-anchor="middle" font-size="8" font-weight="800">OAI</text><text class="nt" x="845" y="723" text-anchor="middle">OpenAI</text><text class="ns" x="845" y="742" text-anchor="middle">native + compatible models</text></g>
<g><rect class="provider" x="965" y="670" width="190" height="90" rx="3"/><circle cx="1060" cy="694" r="12" fill="#4d6bfe"/><text x="1060" y="698" text-anchor="middle" font-size="8" font-weight="800">DS</text><text class="nt" x="1060" y="723" text-anchor="middle">DeepSeek</text><text class="ns" x="1060" y="742" text-anchor="middle">OpenAI-compatible chat</text></g>
<g><rect class="provider" x="1180" y="670" width="190" height="90" rx="3"/><circle cx="1275" cy="694" r="12" fill="#f77f00"/><text x="1275" y="698" text-anchor="middle" font-size="8" font-weight="800">OR</text><text class="nt" x="1275" y="723" text-anchor="middle">OpenRouter</text><text class="ns" x="1275" y="742" text-anchor="middle">multi-model gateway</text></g>
<text class="an mono" x="1060" y="781" text-anchor="middle">PROVIDER SPI · AUTH · COST · LIMITS · OPENAI TRANSPORT</text>

